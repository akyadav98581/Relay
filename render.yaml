# One web service: it serves the built web app, the API, the webhooks, the workers and the scheduler.
# Keep it at one instance (see README, "Limits"). The database is external, see DATABASE_URL.
services:
  - type: web
    name: relay
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # the Postgres connection string, set in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: MIN_SCHEDULE_MINUTES
        value: 5
      - key: MAX_WORKFLOWS_PER_USER
        value: 10

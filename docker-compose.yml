# docker compose up --build, then open http://localhost:3001
services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://relay:relay@db:5432/relay
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-something-at-least-24-chars
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pg-data:
